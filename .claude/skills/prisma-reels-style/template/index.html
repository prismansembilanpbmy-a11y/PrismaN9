<!doctype html>
<html
  lang="ms"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"navy","type":"color","label":"Navy PRISMA","default":"#16236E"},
    {"id":"yellow","type":"color","label":"Kuning aksen","default":"#F7C600"},
    {"id":"red","type":"color","label":"Merah N9","default":"#D21F26"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --navy: #16236e;
        --yellow: #f7c600;
        --red: #d21f26;
        --ink: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #111;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #talk-frame {
        position: absolute;
        inset: 0;
        z-index: 1;
        transform-origin: 540px 600px;
      }
      #talk {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="64.8"
      data-width="1080"
      data-height="1920"
    >
      <!-- Talking head: silences already cut (tools/cut.py); punch-ins scale the frame -->
      <div id="talk-frame">
        <video
          id="talk"
          class="clip"
          src="assets/talk.mp4"
          data-start="0"
          data-duration="61.567"
          data-track-index="0"
          data-has-audio="true"
          data-volume="1"
          playsinline
        ></video>
      </div>

      <div id="broll" class="scene" data-composition-id="broll" data-composition-src="compositions/broll.html"
        data-start="0" data-duration="55.02" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <div id="cards" class="scene" data-composition-id="cards" data-composition-src="compositions/cards.html"
        data-start="0" data-duration="55.02" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>

      <div id="captions" class="scene" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="55.02" data-track-index="3" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 4"></div>

      <div id="hook" class="scene" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3.1" data-track-index="4" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>

      <div id="slogan" class="scene" data-composition-id="slogan" data-composition-src="compositions/slogan.html"
        data-start="55.02" data-duration="4.78" data-track-index="4" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>

      <div id="endcard" class="scene" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="59.8" data-duration="5" data-track-index="5" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 6"></div>

      <div id="iris" class="scene" data-composition-id="iris" data-composition-src="compositions/iris.html"
        data-start="0" data-duration="64.8" data-track-index="6" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 8"></div>

      <!-- Sound effects: start = picture time - file peak + 1 frame -->
      <audio id="sfx-plate" class="clip" src="assets/sfx/pop.mp3" data-start="0.813" data-duration="0.72" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-typing" class="clip" src="assets/sfx/typing.mp3" data-start="60.75" data-duration="1.15" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-hook-out" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.971" data-duration="0.575" data-track-index="10" data-volume="0.4"></audio>
      <audio id="sfx-name" class="clip" src="assets/sfx/pop.mp3" data-start="3.363" data-duration="0.72" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-age" class="clip" src="assets/sfx/pop.mp3" data-start="9.163" data-duration="0.72" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-rtm" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="22.871" data-duration="0.575" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-oku" class="clip" src="assets/sfx/click-soft.mp3" data-start="26.36" data-duration="0.366" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-waghih" class="clip" src="assets/sfx/whoosh.mp3" data-start="38.471" data-duration="0.575" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-atlet" class="clip" src="assets/sfx/pop.mp3" data-start="42.113" data-duration="0.72" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-slogan" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="54.98" data-duration="2.116" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-end" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="59.671" data-duration="0.575" data-track-index="10" data-volume="0.4"></audio>

      <!-- Music bed: generated locally with MusicGen (tools/musicgen.py), no credit needed.
           Sits under her voice, lifts once she stops talking, fades out on the end card. -->
      <audio
        id="bgm"
        class="clip"
        src="assets/bgm/ai-track.wav"
        data-start="0"
        data-duration="64.8"
        data-track-index="13"
        data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.14},{"t":61.5,"v":0.14},{"t":62.3,"v":0.55},{"t":63.3,"v":0.55},{"t":64.8,"v":0}]}]}'
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Hide each jump cut by alternating the framing, and punch in every 3-4 s on a stressed word.
      const punches = [
        [0, 1.0], [6.09, 1.06], [10.71, 1.1], [15.4, 1.0], [18.84, 1.12], [22.02, 1.0], [23.55, 1.1],
        [29.7, 1.0], [32.64, 1.08], [37.11, 1.1], [45.37, 1.0], [47.42, 1.07], [49.57, 1.14], [51.77, 1.0], [55.02, 1.08],
      ];
      punches.forEach(([t, s]) => tl.set("#talk-frame", { scale: s }, t));
      tl.set({}, {}, 64.8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
