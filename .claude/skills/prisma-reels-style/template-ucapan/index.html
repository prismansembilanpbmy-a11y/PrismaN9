<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #4a0710;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #talk-frame {
        position: absolute;
        inset: 0;
        z-index: 1;
        transform-origin: 540px 870px;
      }
      #talk {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="76" data-width="1080" data-height="1920">
      <!-- Speech: both parts joined, party list and long pauses removed (tools/cut2.py) -->
      <div id="talk-frame">
        <video id="talk" class="clip" src="assets/talk.mp4" data-start="0" data-duration="72.35" data-track-index="0"
          data-has-audio="true" data-volume="1" playsinline></video>
      </div>

      <div id="broll" class="scene" data-composition-id="broll" data-composition-src="compositions/broll.html"
        data-start="0" data-duration="15.85" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <div id="cards" class="scene" data-composition-id="cards" data-composition-src="compositions/cards.html"
        data-start="0" data-duration="67.8" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>

      <div id="captions" class="scene" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="67.8" data-track-index="3" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 4"></div>

      <div id="hook" class="scene" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="5.7" data-track-index="4" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>

      <div id="endcard" class="scene" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="67.8" data-duration="8.2" data-track-index="5" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 6"></div>

      <div id="iris" class="scene" data-composition-id="iris" data-composition-src="compositions/iris.html"
        data-start="0" data-duration="76" data-track-index="6" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 8"></div>

      <!-- Sound effects: start = picture time - file peak + 1 frame -->
      <audio id="sfx-name" class="clip" src="assets/sfx/pop.mp3" data-start="0.713" data-duration="0.72" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-iris1" class="clip" src="assets/sfx/whoosh.mp3" data-start="5.571" data-duration="0.575" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-photo2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="10.721" data-duration="0.575" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-age" class="clip" src="assets/sfx/pop.mp3" data-start="20.663" data-duration="0.72" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-iris2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="35.471" data-duration="0.575" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-e1" class="clip" src="assets/sfx/click-soft.mp3" data-start="41.26" data-duration="0.366" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-e2" class="clip" src="assets/sfx/pop.mp3" data-start="42.213" data-duration="0.72" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-e3" class="clip" src="assets/sfx/click-soft.mp3" data-start="43.06" data-duration="0.366" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-e4" class="clip" src="assets/sfx/pop.mp3" data-start="43.463" data-duration="0.72" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-selamat" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="63.26" data-duration="2.116" data-track-index="13" data-volume="0.45"></audio>
      <audio id="sfx-iris3" class="clip" src="assets/sfx/whoosh.mp3" data-start="67.671" data-duration="0.575" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-stamp" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="68.99" data-duration="1.5" data-track-index="13" data-volume="0.4"></audio>
      <audio id="sfx-typing" class="clip" src="assets/sfx/typing.mp3" data-start="70.1" data-duration="1.15" data-track-index="12" data-volume="0.3"></audio>

      <!-- Music bed: generated locally with MusicGen, no credit needed.
           Under the voice, lifts after the last word, fades out on the end card. -->
      <audio id="bgm" class="clip" src="assets/bgm/ai-track.wav" data-start="0" data-duration="76" data-track-index="14"
        data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.12},{"t":72.3,"v":0.12},{"t":73.1,"v":0.5},{"t":74.6,"v":0.5},{"t":76,"v":0}]}]}'></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Hide each jump cut by alternating the framing, and punch in on stressed words.
      const punches = [
        [0, 1.0], [15.85, 1.08], [19.0, 1.14], [20.07, 1.0], [23.41, 1.08], [27.98, 1.0], [30.95, 1.08],
        [33.69, 1.0], [34.56, 1.08], [35.61, 1.0], [36.74, 1.08], [41.3, 1.0], [44.06, 1.08], [47.4, 1.0],
        [49.8, 1.1], [53.5, 1.0], [56.9, 1.08], [60.0, 1.0], [62.91, 1.1],
      ];
      punches.forEach(([t, s]) => tl.set("#talk-frame", { scale: s }, t));
      tl.set({}, {}, 76);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
